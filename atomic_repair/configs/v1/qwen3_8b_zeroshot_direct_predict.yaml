### v1 predict — A zero-shot DIRECT repair (base Instruct)
### Greedy decoding. Pull the generated_predictions.jsonl back for scoring.

model_name_or_path: /path/to/Qwen3-8B-Instruct

dataset: repair_zeroshot_direct_v1
dataset_dir: ./data_v1
template: qwen
cutoff_len: 2048

stage: sft
do_predict: true
finetuning_type: full

per_device_eval_batch_size: 4
predict_with_generate: true
max_new_tokens: 64
temperature: 0.0
top_p: 1.0
bf16: true

output_dir: ./output_v1/predict_zeroshot_direct
overwrite_output_dir: true
report_to: none
