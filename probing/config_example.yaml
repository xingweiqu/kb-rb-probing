# Example config for the probing toolkit.
# Copy and edit this file for your experiment.

# ── Paths ──────────────────────────────────────────────────────────────────────
metadata_path: "metadata.jsonl"          # JSONL with one row per (family, variant)
hidden_state_root: "hidden_states/"      # Root dir for .pt / .npy files
output_dir: "probing_outputs"

# ── Field name mapping ─────────────────────────────────────────────────────────
# Map internal field names to actual field names in your JSONL.
# For items.jsonl (generate_items.py format):
field_map:
  family_id: "id"
  task_family: "category"
# For probe_v2.py output format, leave field_map empty: {}

# ── Scoring ────────────────────────────────────────────────────────────────────
score_field: "score"   # Field name for the scalar score (accuracy or logprob)

# ── Behavioral label thresholds ────────────────────────────────────────────────
threshold_mode: "fixed"   # "fixed" or "quantile"
thresholds:
  tau_p: 0.1    # premise_sensitive threshold
  tau_s: 0.1    # scaffold_sensitive threshold
  tau_r: 0.1    # removal_dependent threshold
  tau_u: 0.1    # substitution_robust threshold (drop < tau_u → robust)
  tau_w: 0.1    # wrong_claim_susceptible threshold

# ── Probe settings ─────────────────────────────────────────────────────────────
seeds: [0, 1, 2, 3, 4]
layers: "all"            # "all" or a list like [0, 8, 16, 24, 32]
position_type: null      # "final_input", "pre_answer", "span_mean", or null
probe_type: "logistic"   # "logistic" or "ridge"
class_weight: "balanced"

# ── Split settings ─────────────────────────────────────────────────────────────
split_mode: "random"     # "random", "held_out_subfamily", "cross_variant", "kb_rb_to_hybrid"
test_size: 0.3

# ── Hidden state mode ──────────────────────────────────────────────────────────
delta_mode: false          # true = use h_variant - h_original
variant_for_delta: null    # which variant to use for delta (auto-set per target if null)
variants_to_include: []    # empty = all variants

# ── Optional: extract hidden states from a model directly ──────────────────────
# Uncomment to enable on-the-fly extraction (requires GPU + transformers)
# model_name: "/opt/tiger/Flame/Qwen3-8B"
# device: "cuda"
# max_length: 256
